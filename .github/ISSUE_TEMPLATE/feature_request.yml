name: ✨ Idee vorschlagen
description: Eine neue Funktion oder Verbesserung vorschlagen
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Worum geht es?
      description: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Vorschlag
      description: Wie könnte die Lösung aussehen?
